<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Odin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: white;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .hero img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #3b82f6;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin: 10px 0;
    }

    p {
      color: #cbd5f5;
      max-width: 500px;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #2563eb;
    }

  </style>
</head>



  
<body>
  <div class="hero">
    <img src="https://res.cloudinary.com/dh7gl6628/image/upload/v1742275484/IMG_20240715_130123_nca9nq.jpg" alt="Profile photo">

    <h1>Odin</h1>
    <p>
      An autonomous cloud infrastructure management system for Monitoring, analysing, and responding to operational events ensuring reliability, scalability and resilience across multiple cloud instances.
    </p>

    <a class="btn" href="https://github.com/modrisco89/odin">
      Repo
    </a>
    <a class="btn" href="https://www.youtube.com/embed/MIetin3TS_8">
      Presentation
    </a>
  </div>


</body>
</html>
