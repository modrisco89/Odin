<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Odin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: white;
}

.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  padding: 20px;
  box-sizing: border-box;
}

.profile-img {
  width: clamp(90px, 20vw, 150px);
  height: clamp(90px, 20vw, 150px);
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #3b82f6;
}

.square-img {
  width: min(440px, 90vw);
  height: auto;
  object-fit: contain;
  margin-top: 20px;
}

h1 {
  font-size: clamp(1.8rem, 4vw, 2.5rem);
  margin: 10px 0;
}

h2 {
  font-size: clamp(1rem, 2.5vw, 1.3rem);
  color: #cbd5f5;
}

p {
  color: #cbd5f5;
  max-width: 600px;
  font-size: clamp(0.9rem, 2vw, 1rem);
  line-height: 1.5;
}


.btn {
  margin-top: 15px;
  padding: 12px 24px;
  background: #3b82f6;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  transition: 0.2s;
  display: inline-block;
}

.btn:hover {
  background: #2563eb;
}

@media (max-width: 480px) {
  .hero {
    padding: 15px;
  }

  .btn {
    width: 80%;
  }
}

  </style>
</head>



  
<body>
  <div class="hero">
    <img class="profile-img"  src="https://res.cloudinary.com/dh7gl6628/image/upload/v1742275484/IMG_20240715_130123_nca9nq.jpg">

    <h1>Odin</h1>
    <h2>Michael O'Driscoll - 20099693</h2>
    <p>
      An autonomous cloud infrastructure management system for Monitoring, analysing, and responding to operational events ensuring reliability, scalability and resilience across multiple cloud instances.
    </p>
    <img class="square-img" src="https://res.cloudinary.com/dh7gl6628/image/upload/v1775894209/showcase_oxciot.png">

    <a class="btn" href="https://www.youtube.com/embed/MIetin3TS_8" target="_blank">
      Presentation
    </a>
    <a class="btn" href="https://github.com/modrisco89/odin">
      Repo
    </a>

  </div>


</body>
</html>
